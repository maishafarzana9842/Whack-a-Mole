
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack a Mole</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="garden">

        <header>
            <div class="wood-title">
                <h1>Whack a Mole!</h1>
                <p>Catch the mole before time runs out!</p>
            </div>
        </header>

        <div class="info">

            <div class="score-card">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>

            <div class="score-card">
                <span>TIME</span>
                <strong id="time">30</strong>
            </div>

            <div class="score-card">
                <span>BEST</span>
                <strong id="bestScore">0</strong>
            </div>

        </div>

        <div class="game">

            <div class="hole" id="hole0"><span></span></div>
            <div class="hole" id="hole1"><span></span></div>
            <div class="hole" id="hole2"><span></span></div>

            <div class="hole" id="hole3"><span></span></div>
            <div class="hole" id="hole4"><span></span></div>
            <div class="hole" id="hole5"><span></span></div>

            <div class="hole" id="hole6"><span></span></div>
            <div class="hole" id="hole7"><span></span></div>
            <div class="hole" id="hole8"><span></span></div>

        </div>

        <div class="bottom-area">

            <p id="message">Ready to play?</p>

            <button id="startBtn">START GAME</button>
            <button id="pauseBtn" disabled>PAUSE</button>

        </div>

        <div class="footer">
            Made with ♥ | Whack a Mole
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
